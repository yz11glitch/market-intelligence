name: Alerts Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  scan-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          ALERTS_SCAN_TOKEN: ${{ secrets.ALERTS_SCAN_TOKEN }}
        run: |
          missing=0
          if [ -z "${RENDER_APP_URL}" ]; then
            echo "::error::Missing secret: RENDER_APP_URL"
            missing=1
          fi
          if [ -z "${ALERTS_SCAN_TOKEN}" ]; then
            echo "::error::Missing secret: ALERTS_SCAN_TOKEN"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Trigger Render alerts scan
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          ALERTS_SCAN_TOKEN: ${{ secrets.ALERTS_SCAN_TOKEN }}
        run: |
          body_file="$(mktemp)"
          call() {
            curl --silent --show-error --max-time 300 -o "${body_file}" -w '%{http_code}' "$@"
          }
          status=$(call -H "Authorization: Bearer ${ALERTS_SCAN_TOKEN}" \
            "${RENDER_APP_URL}/alerts/scan") || status="000"
          if [ "${status}" = "403" ]; then
            # TRANSITION: a server deployed before header auth only accepts ?token=.
            # Remove this fallback once the header-auth server is confirmed live.
            echo "::warning::Header auth rejected (HTTP 403); retrying with legacy query-string token."
            status=$(call "${RENDER_APP_URL}/alerts/scan?token=${ALERTS_SCAN_TOKEN}") || status="000"
          fi
          echo "HTTP ${status}"
          if [ "${status}" = "200" ]; then
            cat "${body_file}"
            exit 0
          fi
          # Only print the server's error code/detail fields: they are written to be safe
          # for this public log. Older server builds put raw exception text in "error",
          # which can include the database host, so that is not echoed.
          reason=$(python3 - "${body_file}" <<'PY' || true
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception:
              data = {}
          if isinstance(data, dict) and data.get("detail"):
              print(f"{data.get('error', 'error')}: {data['detail']}")
          PY
          )
          case "${status}" in
            000) hint="request did not complete (timeout or network error; Render may be cold-starting or down)" ;;
            403) hint="token rejected: ALERTS_SCAN_TOKEN secret does not match the server's ALERTS_SCAN_TOKEN" ;;
            503) hint="server dependency/config problem (database); fix the Render environment, not the code" ;;
            *)   hint="see Render service logs" ;;
          esac
          echo "::error::Alerts scan failed (HTTP ${status}): ${reason:-${hint}}"
          if [ -n "${reason}" ]; then
            echo "Hint: ${hint}"
          fi
          exit 1
